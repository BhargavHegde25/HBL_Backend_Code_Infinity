# File holds all the queries related to logs module

## queries on adminactivity table
MYSQL_ADMINACTIVITY_READ=SELECT * FROM ?1.adminactivity
MSSQL_ADMINACTIVITY_READ=SELECT * FROM ?1.adminactivity
ORACLE_ADMINACTIVITY_READ=SELECT  "id","event","description","username","userRole","moduleName","eventData",cast("eventts" as date) as "eventts","status","createdBy",cast("createdOn" as date) as "createdOn" FROM "?1"."adminactivity"
MYSQL_LIMIT=\t LIMIT :noOfRecords OFFSET :offsetValue
MSSQL_LIMIT=\t offset :offsetValue rows fetch next :noOfRecords rows only
ORACLE_LIMIT=\t offset :offsetValue rows fetch next :noOfRecords rows only
MYSQL_DATE_CAST=DATE(?1)
MSSQL_DATE_CAST=CAST(?1 as DATE)
ORACLE_DATE_CAST=to_char(?1,'yyyy-mm-dd')
MYSQL_LIMIT_ARCH=\tLIMIT :startOffset, :endOffset
MSSQL_LIMIT_ARCH=\toffset :startOffset rows fetch next :endOffset rows only
ORACLE_LIMIT_ARCH=\toffset :startOffset rows fetch next :endOffset rows only
MYSQL_ADMINACTIVITY_INSERT=INSERT INTO ?1.adminactivity (id,event,description,username,userRole,moduleName,eventData,eventts,status,createdBy,createdOn) VALUES (:id,:event,:description,:username,:userRole,:moduleName,:eventData,:eventts,:status,:createdBy,:createdOn)
MSSQL_ADMINACTIVITY_INSERT=INSERT INTO ?1.adminactivity (id,event,description,username,userRole,moduleName,eventData,eventts,status,createdBy,createdOn) VALUES (:id,:event,:description,:username,:userRole,:moduleName,:eventData,:eventts,:status,:createdBy,:createdOn)
