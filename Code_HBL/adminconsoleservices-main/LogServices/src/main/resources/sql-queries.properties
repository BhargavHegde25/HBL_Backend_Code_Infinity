MYSQL_AUDITLOG_INSERT=INSERT INTO ?1.auditactivity(Id,EventId,EventType,EventSubType,Status_Id,sessionId,AppId,UserName,Customer_Id,AdminUserName,AdminUserRole,Producer,MoneyMovementRefId,EventData,creditcardnumber,mfa_State,mfa_ServiceKey,mfa_Type,nonSearchable,phoneNumber,email,deviceModel,operatingSystem,browser,deviceId,channel,appVersion,platform,ipAddress,eventts,createdby,createdts,softdeleteflag)VALUES(:id,:eventid,:eventtype,:eventsubtype,:status_id,:sessionId,:appid,:username,:customer_id,:adminusername,:adminuserrole,:producer,:moneymovementrefid,:eventdata,:creditcardnumber,:mfa_State,:mfa_ServiceKey,:mfa_Type,:nonSearchable,:phoneNumber,:email,:deviceModel,:operatingSystem,:browser,:deviceId,:channel,:appVersion,:platform,:ipAddress,:eventts,:createdby,:createdts,:softdeleteflag)
MSSQL_AUDITLOG_INSERT=INSERT INTO ?1.auditactivity(Id,EventId,EventType,EventSubType,Status_Id,sessionId,AppId,UserName,Customer_Id,AdminUserName,AdminUserRole,Producer,MoneyMovementRefId,EventData,creditcardnumber,mfa_State,mfa_ServiceKey,mfa_Type,nonSearchable,phoneNumber,email,deviceModel,operatingSystem,browser,deviceId,channel,appVersion,platform,ipAddress,eventts,createdby,createdts,softdeleteflag)VALUES(:id,:eventid,:eventtype,:eventsubtype,:status_id,:sessionId,:appid,:username,:customer_id,:adminusername,:adminuserrole,:producer,:moneymovementrefid,:eventdata,:creditcardnumber,:mfa_State,:mfa_ServiceKey,:mfa_Type,:nonSearchable,:phoneNumber,:email,:deviceModel,:operatingSystem,:browser,:deviceId,:channel,:appVersion,:platform,:ipAddress,:eventts,:createdby,:createdts,:softdeleteflag)
ORACLE_AUDITLOG_INSERT=INSERT INTO "?1"."auditactivity"("Id","EventId","EventType","EventSubType","Status_Id","sessionId","AppId","UserName","Customer_Id","AdminUserName","AdminUserRole","Producer","MoneyMovementRefId","EventData","creditcardnumber","mfa_State","mfa_ServiceKey","mfa_Type","nonSearchable","phoneNumber","email","deviceModel","operatingSystem","browser","deviceId","channel","appVersion","platform","ipAddress","eventts","createdby","createdts","softdeleteflag")VALUES(:id,:eventid,:eventtype,:eventsubtype,:status_id,:sessionId,:appid,:username,:customer_id,:adminusername,:adminuserrole,:producer,:moneymovementrefid,:eventdata,:creditcardnumber,:mfa_State,:mfa_ServiceKey,:mfa_Type,:nonSearchable,:phoneNumber,:email,:deviceModel,:operatingSystem,:browser,:deviceId,:channel,:appVersion,:platform,:ipAddress,:eventts,:createdby,:createdts,:softdeleteflag)
MYSQL_AUDITLOG_READ=SELECT Id as id, EventType as moduleName, EventSubType as activityType, Status_Id as status, sessionId,UserName as username, channel, ipAddress, eventts,operatingSystem, IF(deviceModel = '' or ISNULL(deviceModel), browser, deviceModel) as device  FROM ?1.auditactivity WHERE sessionId=:sessionId order by eventts
MSSQL_AUDITLOG_READ=SELECT Id as id, EventType as moduleName, EventSubType as activityType, Status_Id as status, sessionId,UserName as username, channel, ipAddress, eventts,operatingSystem, IIF ((deviceModel = '' or (deviceModel) IS NULL),browser , deviceModel) as device  FROM ?1.auditactivity WHERE sessionId=:sessionId order by eventts
ORACLE_AUDITLOG_READ=SELECT "Id" as id, "EventType" as moduleName, "EventSubType" as activityType, "Status_Id" as status, "sessionId","UserName" as username, "channel", "ipAddress", "eventts","operatingSystem", DECODE ("deviceModel", '' || NULL,"browser" , "deviceModel") as device  FROM "?1"."auditactivity" WHERE "sessionId"=:sessionId order by "eventts"
