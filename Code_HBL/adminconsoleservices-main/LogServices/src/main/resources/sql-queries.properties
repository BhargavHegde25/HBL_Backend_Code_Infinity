MYSQL_AUDITLOG_LAST_N_SESSIONS=SELECT sessionId, min(eventts) as startDate, max(eventts) as endDate, count(*) as numberOfActivities,ipAddress, channel, operatingSystem, deviceModel as device, deviceId, null as browser FROM ?1.auditactivity WHERE UserName=:username and !isnull(sessionId) GROUP BY sessionId ORDER BY endDate DESC LIMIT :limit;
MSSQL_AUDITLOG_LAST_N_SESSIONS=SELECT TOP(:limit) sessionId, min(eventts) as startDate, max(eventts) as endDate, count(*) as numberOfActivities,ipAddress, channel, operatingSystem, deviceModel as device, deviceId, null as browser FROM ?1.auditactivity WHERE UserName=:username and (sessionId IS NOT NULL) GROUP BY sessionId,ipAddress, channel, operatingSystem, deviceModel,deviceId ORDER BY endDate DESC
ORACLE_AUDITLOG_LAST_N_SESSIONS=SELECT "sessionId", min("eventts") as startDate, max("eventts") as endDate, count(*) as numberOfActivities,"ipAddress", "channel", "operatingSystem", "deviceModel" as device, "deviceId", null as browser FROM "?1"."auditactivity" WHERE "UserName"=:username and ("sessionId" IS NOT NULL) GROUP BY "sessionId","ipAddress", "channel", "operatingSystem", "deviceModel","deviceId" ORDER BY endDate DESC  FETCH FIRST :limit ROWS ONLY;

