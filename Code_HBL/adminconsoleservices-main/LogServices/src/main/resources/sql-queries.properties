MYSQL_CUSTOMERACTIVITY_LAST_N_SESSIONS=SELECT sessionId, min(eventts) as startDate, max(eventts) as endDate, count(*) as numberOfActivities,ipAddress, channel, operatingSystem, device, deviceId, browser FROM ?1.customeractivity WHERE username=:username GROUP BY sessionId ORDER BY endDate DESC LIMIT :limit;
MSSQL_CUSTOMERACTIVITY_LAST_N_SESSIONS=SELECT TOP(:limit) sessionId, min(eventts) as startDate, max(eventts) as endDate, count(*) as numberOfActivities,ipAddress, channel, operatingSystem, device, deviceId, browser FROM [?1].customeractivity WHERE username=:username GROUP BY sessionId,ipAddress,channel, operatingSystem, device, deviceId, browser ORDER BY endDate DESC
