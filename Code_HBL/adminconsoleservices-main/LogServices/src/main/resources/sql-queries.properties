MSSQL_ADMINACTIVITY_DELETE=DELETE FROM ?1.adminactivity
ORACLE_ADMINACTIVITY_DELETE=DELETE FROM "?1"."adminactivity"
MYSQL_ADMINACTIVITY_COUNT_READ=SELECT count(1) FROM ?1.adminactivity
